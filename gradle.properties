# Sets default memory used for Gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx4G   # Increased to 4GB for better performance
org.gradle.daemon=true      # Enable Gradle daemon for faster builds
org.gradle.parallel=true    # Enable parallel execution

# Java and Minecraft version settings
JAVA_VERSION=21
MC_VERSION=1.21.4
MC_NEXT_VERSION=1.22
MCP_VERSION=20241203.143248
MAPPING_CHANNEL=official
MAPPING_VERSION=1.21.4

# Build settings
CHECK_COMPATIBILITY=true    # Set to true to enable compatibility checks
UPDATING=false              # Keep false unless updating to a new MC version